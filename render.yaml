services:
  - type: web
    name: planincito-server
    runtime: node
    plan: free
    # El build se hace desde la raíz del monorepo para incluir `shared/`.
    rootDir: .
    buildCommand: npm ci && npm run build:server
    startCommand: npm start --workspace server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLIENT_ORIGIN
        sync: false
      # Frase compartida de acceso: se define en el panel, nunca en el repo.
      - key: ROOM_ACCESS_SECRET
        sync: false
      - key: MAX_ACTIVE_ROOMS
        value: 25
      - key: MAX_PARTICIPANTS_PER_ROOM
        value: 12
      - key: MAX_CONNECTIONS_PER_IP
        value: 48
      # Márgenes amplios: un móvil en segundo plano corta el WebSocket en
      # segundos, y con 60 s expulsaba a gente que seguía en la reunión.
      # Estos valores deben seguir a los de server/src/config.ts: lo que se
      # define aquí sobrescribe el valor por defecto del código.
      - key: EMPTY_ROOM_GRACE_MS
        value: 3600000
      - key: DISCONNECTED_PARTICIPANT_GRACE_MS
        value: 3600000
      - key: LONE_PARTICIPANT_GRACE_MS
        value: 300000
      - key: MIN_PLAYERS_TO_REVEAL
        value: 2
      - key: MAX_ROUND_HISTORY
        value: 50
